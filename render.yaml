services:
  - type: web
    name: nss-connect
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build && pnpm --filter @workspace/db run push
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nss-connect-db
          property: connectionString
      - key: STAFF_SIGNUP_INVITE_PASSWORD
        sync: false

databases:
  - name: nss-connect-db
    databaseName: nss_connect
    user: nss_connect_user
    plan: free

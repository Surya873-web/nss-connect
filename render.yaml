services:
  - type: web
    name: nss-connect
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build && pnpm --filter @workspace/db run push && pnpm --filter @workspace/db run apply-staff-limit
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STAFF_SIGNUP_INVITE_PASSWORD
        sync: false
      - key: NSS_COLLEGE_NAME
        value: Bannari Amman Institute of Technology
      - key: NSS_UNIT_NAME
        value: National Service Scheme
